name: CD

# Roda somente depois que o CI passar no master. Deploy manual pela aba
# Actions tambem e permitido (workflow_dispatch).
on:
  workflow_run:
    workflows: [CI]
    branches: [master]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy no servidor da FAPEU
    # O servidor e interno, sem IP publico. O runner self-hosted instalado
    # nele so abre conexao de saida para o GitHub, entao nao precisa liberar
    # nenhuma porta de entrada no firewall.
    runs-on: [self-hosted, windows, vagas]
    environment: producao
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    env:
      DESTINO: ${{ vars.DEPLOY_PATH }}
      # Commit exato que o CI aprovou -- e nao "o que estiver no master agora".
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    defaults:
      run:
        shell: powershell

    steps:
      - name: Confere o servidor
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DESTINO)) {
            throw 'Variavel DEPLOY_PATH nao configurada no repositorio.'
          }
          if (-not (Test-Path $env:DESTINO)) {
            throw "DEPLOY_PATH ($env:DESTINO) nao existe no servidor."
          }
          if (-not (Test-Path (Join-Path $env:DESTINO '.git'))) {
            throw "$env:DESTINO nao e um repositorio git. Faca o clone inicial (ver DEPLOY.md)."
          }
          if (-not (Test-Path (Join-Path $env:DESTINO '.env'))) {
            throw "Nao existe .env em $env:DESTINO. Crie o .env de producao antes do primeiro deploy."
          }
          Set-Location $env:DESTINO
          $remote = (git remote get-url origin)
          if ($remote -notmatch 'gabrielcunhalima/vagas') {
            throw "O repositorio em $env:DESTINO aponta para outro remote: $remote"
          }
          Write-Host "Servidor ok. Deploy do commit $env:SHA em $env:DESTINO"

      # Entra em manutencao antes de trocar o codigo, para nenhuma requisicao
      # pegar codigo novo com vendor/assets antigos.
      - name: Modo manutencao
        continue-on-error: true
        run: |
          Set-Location $env:DESTINO
          php artisan down --retry=30

      # reset --hard em vez de pull: deploy deterministico, sem merge e sem
      # travar por alteracao local no servidor. .env, storage/, vendor/ e
      # node_modules/ ficam intactos por estarem no .gitignore.
      - name: Puxa o codigo aprovado
        run: |
          Set-Location $env:DESTINO
          git fetch origin master --prune
          git reset --hard $env:SHA
          Write-Host "HEAD agora: $(git rev-parse --short HEAD) - $(git log -1 --pretty=%s)"

      - name: Dependencias PHP
        run: |
          Set-Location $env:DESTINO
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress --prefer-dist

      - name: Dependencias JS e build dos assets
        run: |
          Set-Location $env:DESTINO
          npm ci
          npm run build

      - name: Migrations
        run: |
          Set-Location $env:DESTINO
          php artisan migrate --force

      - name: Recria os caches
        run: |
          Set-Location $env:DESTINO
          php artisan optimize

      - name: Reinicia a fila
        run: |
          Set-Location $env:DESTINO
          php artisan queue:restart

      # Sai da manutencao mesmo se algum passo acima falhar, para nao deixar
      # o site fora do ar.
      - name: Sai do modo manutencao
        if: always()
        run: |
          Set-Location $env:DESTINO
          php artisan up
